name: 상세 데이터 수집

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '비어 있는 종목만(blank) / 전체 강제(all)'
        type: choice
        options: [blank, all]
        default: blank

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 상세 수집
        run: |
          if [ "${{ github.event.inputs.mode }}" = "all" ]; then
            python3 build/fetch_details.py --all
          else
            python3 build/fetch_details.py
          fi

      - name: 페이지 빌드
        run: python3 build/render.py

      - name: 커밋
        run: |
          git config user.name  "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add -A data/state.json index.html
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "상세 데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
          fi
