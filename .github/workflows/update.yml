name: 포트폴리오 갱신

on:
  schedule:
    - cron: '30 22 * * 0-4'
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
    inputs:
      weekly:
        description: 'weekly chart refresh'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fetch prices
        run: |
          if [ "${{ github.event.inputs.weekly }}" = "true" ] || [ "$(TZ=Asia/Seoul date +%u)" = "1" ]; then
            python3 build/fetch_prices.py --weekly
          else
            python3 build/fetch_prices.py
          fi
      - name: build page
        run: python3 build/render.py
      - name: commit
        run: |
          git config user.name portfolio-bot
          git config user.email portfolio-bot@users.noreply.github.com
          git add -A data/state.json index.html
          if git diff --staged --quiet; then
            echo no-change
          else
            git commit -m "update $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
          fi
