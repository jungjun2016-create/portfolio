name: 포트폴리오 갱신

on:
  schedule:
    # UTC 기준. 07:30 KST(월~금) = 22:30 UTC(일~목) — 미국 장 마감 후, 아시아 장 시작 전
    - cron: '30 22 * * 0-4'
    # 17:30 KST(월~금) = 08:30 UTC — 한국·홍콩 장 마감 후
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
    inputs:
      weekly:
        description: '주봉 차트 데이터도 갱신'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 시세 수집
        run: |
          if [ "${{ github.event.inputs.weekly }}" = "true" ] || [ "$(TZ=Asia/Seoul date +%u)" = "1" ]; then
            python3 build/fetch_prices.py --weekly
          else
            python3 build/fetch_prices.py
          fi

      - name: 페이지 빌드
        run: python3 build/render.py

      - name: 커밋
        run: |
          git config user.name  "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add -A data/state.json index.html
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
          fi
